<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#161614">
<title>{{ page.title }}</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<style>
/* The app's own colours, type and icon (theme.js: palette, fonts). Nothing is loaded from another site. */
:root { color-scheme: dark; --bg: #161614; --surface: #1e1d1a; --track: #2a2925; --cream: #efeadf; --secondary: #a39e92; --clay: #c9795a; --peach: #e3a487; }
body { margin: 0; background: var(--bg); color: var(--cream); font: 17px/1.65 system-ui, -apple-system, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif; -webkit-text-size-adjust: 100%; }
header { border-bottom: 1px solid var(--track); background: var(--surface); }
.brand { max-width: 42rem; margin: 0 auto; padding: 0.9rem 1.25rem; display: flex; align-items: center; gap: 0.75rem; }
.brand img { width: 40px; height: 40px; border-radius: 22%; display: block; }
.brand span, h2, h3 { font-family: "HelveticaNeue-CondensedBlack", "Helvetica Neue", "Arial Narrow", "Roboto Condensed", sans-serif; font-weight: 900; font-stretch: condensed; text-transform: uppercase; }
.brand span { font-size: 1.35rem; letter-spacing: 0.02em; }
main { max-width: 42rem; margin: 0 auto; padding: 2.25rem 1.25rem 4rem; }
h2 { font-size: 1.9rem; line-height: 1.15; margin: 0 0 1rem; color: var(--cream); }
h3 { font-size: 1.2rem; letter-spacing: 0.03em; line-height: 1.3; margin: 2.2rem 0 0.6rem; padding-top: 1.2rem; border-top: 1px solid var(--track); color: var(--clay); }
p, li { margin: 0.7rem 0; }
ul { padding-left: 1.4rem; }
a { color: var(--peach); }
a:hover { color: var(--cream); }
strong { color: var(--cream); }
p:first-of-type { color: var(--cream); }
table { border-collapse: collapse; width: 100%; margin: 1rem 0; font-size: 0.95rem; background: var(--surface); }
th, td { text-align: left; vertical-align: top; padding: 0.55rem 0.7rem; border: 1px solid var(--track); }
th { color: var(--secondary); font-size: 0.75rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; }
</style>
</head>
<body>
<header>
<div class="brand"><img src="/assets/logo-192.png" alt="Protein Dashboard logo" width="40" height="40"><span>Protein Dashboard</span></div>
</header>
<main>
{{ content }}
</main>
</body>
</html>
