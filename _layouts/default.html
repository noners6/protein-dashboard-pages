<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}</title>
<style>
:root { color-scheme: light dark; --bg: #fbfaf8; --text: #2d3238; --muted: #5d646c; --rule: #dcd8d0; --link: #2f5d8a; --head: #1f2a36; --band: #f1eee8; }
@media (prefers-color-scheme: dark) { :root { --bg: #1b1f24; --text: #dde1e5; --muted: #a2a9b0; --rule: #3a4048; --link: #8db7e0; --head: #f0f2f4; --band: #242a31; } }
body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.65 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
main { max-width: 42rem; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
h2, h3 { font-family: Georgia, "Times New Roman", serif; color: var(--head); font-weight: 600; line-height: 1.3; }
h2 { font-size: 1.9rem; margin: 0 0 1rem; }
h3 { font-size: 1.25rem; margin: 2.2rem 0 0.6rem; padding-top: 1.2rem; border-top: 1px solid var(--rule); }
p, li { margin: 0.7rem 0; }
ul { padding-left: 1.4rem; }
a { color: var(--link); }
table { border-collapse: collapse; width: 100%; margin: 1rem 0; font-size: 0.95rem; }
th, td { text-align: left; vertical-align: top; padding: 0.55rem 0.7rem; border: 1px solid var(--rule); }
th { background: var(--band); color: var(--head); }
</style>
</head>
<body>
<main>
{{ content }}
</main>
</body>
</html>
